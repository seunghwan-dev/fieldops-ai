version: "3.9"

services:
  # ===== Vector Database =====
  oracle:
    image: container-registry.oracle.com/database/free:latest
    environment:
      - ORACLE_PWD=${ORACLE_PASSWORD}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle-init:/opt/oracle/scripts/startup
    ports:
      - "1521:1521"
    mem_limit: 12g
    healthcheck:
      test: >
        CMD-SHELL echo 'SELECT 1 FROM DUAL;' |
        sqlplus -s $${ORACLE_USER}/$${ORACLE_PASSWORD}@localhost/$${ORACLE_SERVICE}
        | grep -q '1' || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ===== AI Models (Qwen 7B only) =====
  ollama:
    image: ollama/ollama:latest
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q qwen || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ===== Ollama Model Setup (one-time init) =====
  ollama-setup:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    entrypoint: >
      sh -c "
        until ollama list 2>/dev/null; do sleep 2; done &&
        ollama pull qwen2.5:7b-instruct-q4_K_M &&
        echo '=== FieldOps-AI: Qwen 7B model pull completed ==='
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    profiles: [init]

  # ===== Embedding Server (e5-large) =====
  embedding:
    build: ./embedding
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    ports:
      - "8001:8001"
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===== API Gateway =====
  backend:
    build: ./backend
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - ORACLE_HOST=oracle
      - ORACLE_USER=${ORACLE_USER}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - ORACLE_SERVICE=${ORACLE_SERVICE}
      - EMBEDDING_HOST=http://embedding:8001
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      oracle:
        condition: service_healthy
      ollama:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  ollama-models:
  oracle-data:
