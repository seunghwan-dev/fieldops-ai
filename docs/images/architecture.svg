  <text x="340" y="382" text-anchor="middle" fill="#475569" font-size="9">GPU passthrough</text>

  <rect x="440" y="155" width="320" height="240" rx="8" fill="#2a1f0a" stroke="#f59e0b" stroke-width="1"/>
