  <text x="674" y="244" text-anchor="middle" fill="#7c5a3a" font-size="9">+ SHAP</text>

  <rect x="458" y="265" width="284" height="32" rx="6" fill="#1e1a2e" stroke="#a78bfa" stroke-width="1"/>
  <text x="600" y="285" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">Layer 1: LLM Fusion</text>

  <rect x="458" y="306" width="284" height="32" rx="6" fill="#2e1a1a" stroke="#ef4444" stroke-width="1"/>
  <text x="600" y="326" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">Layer 2: Rule-based Safety</text>

  <text x="600" y="362" text-anchor="middle" fill="#94a3b8" font-size="10">↓ assembles final response</text>
  <text x="600" y="380" text-anchor="middle" fill="#475569" font-size="9">predict() — fusion_service.py</text>

