  <text x="135" y="252" fill="#93c5fd" font-size="11" font-weight="600">PDF Papers</text>
  <text x="135" y="268" fill="#64748b" font-size="9">Research / Reports</text>
  <text x="135" y="282" fill="#64748b" font-size="9">User upload</text>

