  <line x1="600" y1="395" x2="600" y2="428" stroke="#475569" stroke-width="1" marker-end="url(#arr5)"/>

  <text x="400" y="510" text-anchor="middle" fill="#475569" font-size="10">All Docker services connected via internal DNS</text>
