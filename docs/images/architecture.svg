  <text x="525" y="230" text-anchor="middle" fill="#4a7c7c" font-size="9">HNSW + BM25</text>
  <text x="525" y="244" text-anchor="middle" fill="#4a7c7c" font-size="9">+ RRF (k=60)</text>

  <rect x="607" y="192" width="135" height="60" rx="6" fill="#2b1a0f" stroke="#f97316" stroke-width="1"/>
