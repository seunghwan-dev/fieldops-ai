  <text x="225" y="108" text-anchor="middle" fill="#64748b" font-size="9">Page images</text>

  <line x1="458" y1="222" x2="420" y2="205" stroke="#475569" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr5)"/>
  <text x="438" y="200" text-anchor="middle" fill="#64748b" font-size="9">embed</text>

  <line x1="458" y1="282" x2="420" y2="320" stroke="#475569" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr5)"/>
  <text x="438" y="298" text-anchor="middle" fill="#64748b" font-size="9">prompt</text>

  <rect x="260" y="430" width="500" height="40" rx="8" fill="#0f2b1a" stroke="#22c55e" stroke-width="1"/>
