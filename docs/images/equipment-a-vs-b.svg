<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }</style>
  <rect width="800" height="300" fill="#0f172a" rx="12"/>
  <text x="400" y="28" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="500">EQUIPMENT A vs B: DIFFERENT ML APPROACHES</text>

  <rect x="40" y="44" width="350" height="220" rx="12" fill="#0f2b2b" stroke="#14b8a6" stroke-width="1"/>
  <text x="215" y="68" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="600">Equipment A (Mixer)</text>
  <rect x="70" y="82" width="290" height="28" rx="6" fill="#1a3a3a" stroke="#14b8a6" stroke-width="0.5"/>
  <text x="215" y="100" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="600">Pure ML (RandomForest)</text>
  <text x="80" y="130" fill="#94a3b8" font-size="10">No formula or simulation exists</text>
  <text x="80" y="148" fill="#94a3b8" font-size="10">Variable selection from experiment reports:</text>
  <rect x="70" y="158" width="90" height="20" rx="4" fill="#14b8a620" stroke="#14b8a6" stroke-width="0.5"/>
  <text x="115" y="172" text-anchor="middle" fill="#5eead4" font-size="9">Property A</text>
  <rect x="170" y="158" width="90" height="20" rx="4" fill="#14b8a620" stroke="#14b8a6" stroke-width="0.5"/>
  <text x="215" y="172" text-anchor="middle" fill="#5eead4" font-size="9">Property B</text>
  <rect x="270" y="158" width="90" height="20" rx="4" fill="#14b8a620" stroke="#14b8a6" stroke-width="0.5"/>
  <text x="315" y="172" text-anchor="middle" fill="#5eead4" font-size="9">Property C</text>
  <text x="80" y="198" fill="#64748b" font-size="10">+ process conditions (temp, RPM, input rate)</text>
  <rect x="70" y="212" width="290" height="22" rx="4" fill="#0a1a1a" stroke="#14b8a640" stroke-width="0.5"/>
  <text x="215" y="227" text-anchor="middle" fill="#4a7c7c" font-size="10">Output: discharge temperature (°C)</text>

  <text x="400" y="158" text-anchor="middle" fill="#475569" font-size="16" font-weight="700">vs</text>

  <rect x="410" y="44" width="350" height="220" rx="12" fill="#2b1a0f" stroke="#f97316" stroke-width="1"/>
  <text x="585" y="68" text-anchor="middle" fill="#fdba74" font-size="13" font-weight="600">Equipment B (Grinder)</text>
  <rect x="440" y="82" width="290" height="28" rx="6" fill="#3a2a1a" stroke="#f97316" stroke-width="0.5"/>
  <text x="585" y="100" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="600">Bond's Law + ML Error Correction</text>
  <text x="450" y="130" fill="#94a3b8" font-size="10">Physics formula (Bond's Law):</text>
  <text x="450" y="148" fill="#fdba74" font-size="10">Accurate at specific RPM range</text>
  <rect x="450" y="158" width="130" height="20" rx="4" fill="#22c55e20" stroke="#22c55e" stroke-width="0.5"/>
  <text x="515" y="172" text-anchor="middle" fill="#86efac" font-size="9">Physics accurate</text>
  <rect x="590" y="158" width="130" height="20" rx="4" fill="#ef444420" stroke="#ef4444" stroke-width="0.5"/>
  <text x="655" y="172" text-anchor="middle" fill="#fca5a5" font-size="9">ML corrects error</text>
  <text x="450" y="198" fill="#64748b" font-size="10">AI compensates deviation outside reliable range</text>
  <rect x="440" y="212" width="290" height="22" rx="4" fill="#1a0f0a" stroke="#f9731640" stroke-width="0.5"/>
  <text x="585" y="227" text-anchor="middle" fill="#7c5a3a" font-size="10">Output: particle size d50 (μm)</text>
</svg>
