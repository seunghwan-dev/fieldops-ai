<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }</style>
  <rect width="800" height="280" fill="#0f172a" rx="12"/>
  <text x="400" y="28" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="500">BEFORE / AFTER</text>

  <rect x="40" y="44" width="350" height="200" rx="12" fill="#1a0f0f" stroke="#ef4444" stroke-width="1"/>
