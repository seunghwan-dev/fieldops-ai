  <text x="215" y="131" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="600">No warning</text>
  <text x="215" y="160" text-anchor="middle" fill="#64748b" font-size="11">Evidence: none</text>
  <text x="215" y="178" text-anchor="middle" fill="#64748b" font-size="11">SHAP: available</text>
  <rect x="100" y="196" width="230" height="22" rx="4" fill="#1a1a2e" stroke="#334155" stroke-width="0.5"/>
  <text x="215" y="211" text-anchor="middle" fill="#475569" font-size="10">requires_human_review: true</text>

  <text x="400" y="148" text-anchor="middle" fill="#475569" font-size="20">→</text>

  <rect x="410" y="44" width="350" height="200" rx="12" fill="#0a1a0a" stroke="#22c55e" stroke-width="1"/>
  <text x="585" y="68" text-anchor="middle" fill="#86efac" font-size="13" font-weight="600">Fusion (After)</text>
