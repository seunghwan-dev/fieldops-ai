  <text x="585" y="178" text-anchor="middle" fill="#64748b" font-size="11">SHAP: available</text>
  <rect x="470" y="196" width="230" height="22" rx="4" fill="#1a1a2e" stroke="#334155" stroke-width="0.5"/>
  <text x="585" y="211" text-anchor="middle" fill="#475569" font-size="10">requires_human_review: true</text>

  <rect x="340" y="252" width="120" height="22" rx="6" fill="#1e1a2e" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="400" y="267" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">Correction: -43°C</text>
