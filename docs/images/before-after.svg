  <rect x="495" y="116" width="180" height="22" rx="4" fill="#1a0f0f" stroke="#ef4444" stroke-width="0.8"/>
  <text x="585" y="131" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="600">CRITICAL: Thermal runaway risk</text>
