<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
  <rect width="800" height="200" fill="#0f172a" rx="12"/>

  <text x="400" y="28" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="500">HARDWARE</text>

  <rect x="40" y="46" width="170" height="100" rx="10" fill="#1a1a2e" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="125" y="72" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">CPU</text>
  <text x="125" y="96" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">Core i9-13900KF</text>
  <text x="125" y="118" text-anchor="middle" fill="#64748b" font-size="11">24 cores / 32 threads</text>
  <text x="125" y="136" text-anchor="middle" fill="#475569" font-size="10">ML training + API server</text>

  <rect x="230" y="46" width="170" height="100" rx="10" fill="#0f2b1a" stroke="#22c55e" stroke-width="0.8"/>
  <text x="315" y="72" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">GPU</text>
  <text x="315" y="96" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">RTX 4070 SUPER</text>
  <text x="315" y="118" text-anchor="middle" fill="#64748b" font-size="11">12GB VRAM</text>
  <text x="315" y="136" text-anchor="middle" fill="#475569" font-size="10">Qwen 7B + e5-large</text>

  <rect x="420" y="46" width="170" height="100" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="505" y="72" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">RAM</text>
  <text x="505" y="96" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">DDR5 64GB</text>
  <text x="505" y="118" text-anchor="middle" fill="#64748b" font-size="11">4 x 16GB</text>
  <text x="505" y="136" text-anchor="middle" fill="#475569" font-size="10">Docker + Oracle + API</text>

  <rect x="610" y="46" width="170" height="100" rx="10" fill="#2b1a0f" stroke="#f97316" stroke-width="0.8"/>
  <text x="695" y="72" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="600">VRAM usage</text>
  <text x="695" y="96" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">~8 GB</text>
  <text x="695" y="114" text-anchor="middle" fill="#64748b" font-size="10">Qwen 7B: 4.5GB</text>
  <text x="695" y="128" text-anchor="middle" fill="#64748b" font-size="10">e5-large: 2GB</text>
  <text x="695" y="142" text-anchor="middle" fill="#64748b" font-size="10">overhead: ~1.5GB</text>

  <rect x="40" y="162" width="740" height="24" rx="6" fill="#1a1a2e" stroke="#334155" stroke-width="0.5"/>
  <text x="400" y="179" text-anchor="middle" fill="#475569" font-size="10">All AI inference runs locally — no cloud GPU required for prediction</text>
</svg>
