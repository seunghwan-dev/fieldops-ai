<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
  <rect width="800" height="420" fill="#0f172a" rx="12"/>

  <text x="400" y="30" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="500">MDSK-RAG DUAL-SOURCE COLLECTION</text>

  <rect x="300" y="48" width="200" height="36" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="400" y="71" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">PDF (papers / reports)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line x1="400" y1="84" x2="400" y2="100" stroke="#475569" stroke-width="1"/>
  <line x1="400" y1="100" x2="200" y2="120" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="400" y1="100" x2="600" y2="120" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="400" y="112" text-anchor="middle" fill="#64748b" font-size="10">GPT-4o Vision extracts</text>

  <rect x="60" y="124" width="280" height="130" rx="10" fill="#0f2b2b" stroke="#14b8a6" stroke-width="1"/>
  <text x="200" y="148" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="600">LITERATURE_CHUNKS</text>
  <text x="200" y="170" text-anchor="middle" fill="#4a7c7c" font-size="11">text + figure semantics</text>
  <line x1="100" y1="182" x2="300" y2="182" stroke="#1a3a3a" stroke-width="0.5"/>
  <text x="200" y="200" text-anchor="middle" fill="#5eead4" font-size="10">"180C is the safe upper limit"</text>
  <text x="200" y="216" text-anchor="middle" fill="#5eead4" font-size="10">"Thermal runaway occurs above 200C"</text>
  <text x="200" y="240" text-anchor="middle" fill="#2d6a6a" font-size="10">Vector + BM25 index</text>

  <rect x="460" y="124" width="280" height="130" rx="10" fill="#2b1a0f" stroke="#f97316" stroke-width="1"/>
  <text x="600" y="148" text-anchor="middle" fill="#fdba74" font-size="13" font-weight="600">QUANTITATIVE_CHUNKS</text>
  <text x="600" y="170" text-anchor="middle" fill="#7c5a3a" font-size="11">table rows + experiment data</text>
  <line x1="500" y1="182" x2="700" y2="182" stroke="#3a2a1a" stroke-width="0.5"/>
  <text x="600" y="200" text-anchor="middle" fill="#fdba74" font-size="10">"Test #7: 205C, FAIL"</text>
  <text x="600" y="216" text-anchor="middle" fill="#fdba74" font-size="10">"60rpm | Onset: 188C"</text>
  <text x="600" y="240" text-anchor="middle" fill="#6a4a2a" font-size="10">Vector + BM25 index</text>

  <rect x="60" y="264" width="680" height="28" rx="6" fill="#1a1a2e" stroke="#334155" stroke-width="0.5"/>
  <text x="400" y="282" text-anchor="middle" fill="#64748b" font-size="10">In production: separates Confidential (internal) vs Public data — same dual-table pattern</text>

  <line x1="200" y1="292" x2="200" y2="310" stroke="#14b8a6" stroke-width="1"/>
  <line x1="600" y1="292" x2="600" y2="310" stroke="#f97316" stroke-width="1"/>
  <line x1="200" y1="310" x2="400" y2="330" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="600" y1="310" x2="400" y2="330" stroke="#475569" stroke-width="1"/>

  <rect x="250" y="332" width="300" height="36" rx="8" fill="#1e1a2e" stroke="#a78bfa" stroke-width="1"/>
  <text x="400" y="355" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">UNION ALL + RRF (k=60)</text>

  <line x1="400" y1="368" x2="400" y2="384" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="180" y="386" width="440" height="28" rx="6" fill="#1a2e1a" stroke="#22c55e" stroke-width="0.8"/>
  <text x="400" y="404" text-anchor="middle" fill="#86efac" font-size="11">LLM: "literature says X, data shows Y" → evidence-based correction</text>
