  <text x="400" y="150" text-anchor="middle" fill="#4a7c7c" font-size="10">answers + citations</text>

  <rect x="530" y="46" width="230" height="110" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
