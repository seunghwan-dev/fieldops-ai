  <line x1="60" y1="82" x2="250" y2="82" stroke="#2e2a3e" stroke-width="0.5"/>
  <text x="155" y="100" text-anchor="middle" fill="#8b7abf" font-size="10">LLM flexible correction</text>
  <text x="155" y="116" text-anchor="middle" fill="#8b7abf" font-size="10">(Layer 1)</text>
  <text x="155" y="134" text-anchor="middle" fill="#8b7abf" font-size="10">+ Rule-based safety</text>
  <text x="155" y="150" text-anchor="middle" fill="#8b7abf" font-size="10">(Layer 2)</text>

  <rect x="285" y="46" width="230" height="110" rx="10" fill="#0f2b2b" stroke="#14b8a6" stroke-width="0.8"/>
  <text x="400" y="72" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="600">RAG Instant Answer</text>
  <line x1="305" y1="82" x2="495" y2="82" stroke="#1a3a3a" stroke-width="0.5"/>
  <text x="400" y="100" text-anchor="middle" fill="#4a7c7c" font-size="10">Vector + BM25 + RRF</text>
