<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }</style>
  <rect width="800" height="200" fill="#0f172a" rx="12"/>
  <text x="400" y="28" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="500">FEATURES</text>

  <rect x="40" y="46" width="230" height="110" rx="10" fill="#1e1a2e" stroke="#a78bfa" stroke-width="0.8"/>
