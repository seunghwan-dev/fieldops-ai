  <rect x="40" y="170" width="720" height="22" rx="6" fill="#1a1a2e" stroke="#334155" stroke-width="0.5"/>
  <text x="400" y="185" text-anchor="middle" fill="#475569" font-size="10">Three core capabilities — each independently useful, exponentially powerful when combined</text>
